name: CI

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workload_manager
          POSTGRES_USER: workload_manager
          POSTGRES_PASSWORD: workload_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U workload_manager"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: back/pom.xml

      - name: Build and test
        working-directory: back
        run: mvn -B clean test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: front
        run: npm install

      - name: Lint
        working-directory: front
        run: npm run lint

      - name: Build
        working-directory: front
        run: npm run build
